[package]
name = "container-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.container]
path = "../crates/container"

# Own workspace so the root virtual manifest does not list this package.
[workspace]
members = ["."]

[[bin]]
name = "parse_container"
path = "fuzz_targets/parse_container.rs"
test = false
doc = false
bench = false

[dependencies.frame]
path = "../crates/frame"

[dependencies.session]
path = "../crates/session"

[[bin]]
name = "accept_record"
path = "fuzz_targets/accept_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_entry"
path = "fuzz_targets/parse_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_index"
path = "fuzz_targets/frame_index.rs"
test = false
doc = false
bench = false
