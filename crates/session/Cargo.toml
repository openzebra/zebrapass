[package]
name = "session"
version = "0.1.0"
description = "Vault create, unlock, and mutation session."
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
legacy-v1 = ["dep:aes-gcm", "dep:argon2"]

[dependencies]
anyhow.workspace = true
aead = { path = "../aead" }
# v1 GCM only. Not in the default build: bearby-cipher does not link here.
aes-gcm = { version = "=0.10.3", optional = true, default-features = false, features = ["aes", "alloc"] }
argon2 = { workspace = true, optional = true, features = ["alloc"] }
container = { path = "../container" }
getrandom.workspace = true
hmac.workspace = true
kdf = { path = "../kdf" }
secret = { path = "../secret" }
sha2.workspace = true
wraps = { path = "../wraps" }
zeroize.workspace = true

[dev-dependencies]
pq = { path = "../pq" }
x25519-dalek.workspace = true

[lints]
workspace = true
