[package]
name = "tui"
version = "0.1.0"
description = "ZebraPass terminal interface."
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zebrapass"
path = "src/main.rs"

[features]
default = ["osc52"]
# Clipboard through the OSC 52 terminal escape (works over SSH, no native dependency).
osc52 = []

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
frame = { path = "../frame" }
getrandom.workspace = true
hmac.workspace = true
import = { path = "../import" }
kdf = { path = "../kdf" }
local = { path = "../local" }
memberlog = { path = "../memberlog" }
p2p-net = { path = "../p2p-net" }
ratatui.workspace = true
record = { path = "../record" }
secrecy.workspace = true
seed = { path = "../seed" }
session = { path = "../session" }
sharing = { path = "../sharing" }
sha1.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
secret = { path = "../secret" }
# Builds .kdbx databases for the import tests.
keepass = { workspace = true, features = ["save_kdbx4"] }

[lints]
workspace = true
