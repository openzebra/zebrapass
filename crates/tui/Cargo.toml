[package]
name = "tui"
version = "0.1.0"
description = "ZebraPass terminal interface."
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zebrapass"
path = "src/main.rs"

[features]
default = ["osc52"]
# Clipboard through the OSC 52 terminal escape (works over SSH, no native dependency).
osc52 = []

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
frame = { path = "../frame" }
getrandom.workspace = true
hmac.workspace = true
kdf = { path = "../kdf" }
local = { path = "../local" }
ratatui.workspace = true
record = { path = "../record" }
secrecy.workspace = true
seed = { path = "../seed" }
session = { path = "../session" }
sha1.workspace = true
subtle.workspace = true
zeroize.workspace = true

[lints]
workspace = true
