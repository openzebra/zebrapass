[workspace]
members = [
    "crates/secret",
    "crates/container",
    "crates/kdf",
    "crates/aead",
    "crates/pq",
    "crates/wraps",
    "crates/session",
    "crates/platform",
    "crates/ec",
    "crates/record",
    "crates/frame",
    "crates/seed",
    "crates/local",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aegis = "=0.9.19"
kuznechik-rs = "=0.1.0"
argon2 = { version = "=0.6.0", default-features = false }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
x25519-dalek = "=3.0.0"
# p256 0.14 zeroizes its scalar types unconditionally (no opt-in feature).
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "arithmetic", "alloc"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc"] }
signature = { version = "=3.0.0", default-features = false }
pqbip39 = "=0.2.0"
rand = "=0.10.3"
secrecy = "=0.10.3"
anyhow = "=1.0.100"
getrandom = "=0.4.3"
# Tests only: KAT vectors are hex strings on the wire of the test files; prod code is bytes-only.
hex = "=0.4.3"
zeroize = "=1.9.0"
subtle = "=2.6.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cargo_common_metadata = "allow"
