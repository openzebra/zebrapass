[workspace]
members = [
    "crates/secret",
    "crates/container",
    "crates/kdf",
    "crates/aead",
    "crates/pq",
    "crates/wraps",
    "crates/session",
    "crates/platform",
    "crates/ec",
    "crates/record",
    "crates/frame",
    "crates/seed",
    "crates/local",
    "crates/import",
    "crates/tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aegis = "=0.9.19"
kuznechik-rs = "=0.1.0"
argon2 = { version = "=0.6.0", default-features = false }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
# TOTP codes only (RFC 6238 mandates HMAC-SHA1); never used for keys or integrity.
sha1 = "=0.11.0"
# p256 0.14 zeroizes its scalar types unconditionally (no opt-in feature).
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "arithmetic", "alloc"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc"] }
signature = { version = "=3.0.0", default-features = false }
pqbip39 = "=0.2.0"
rand = "=0.10.3"
secrecy = "=0.10.3"
anyhow = "=1.0.100"
getrandom = "=0.4.3"
# Tests only: KAT vectors are hex strings on the wire of the test files; prod code is bytes-only.
hex = "=0.4.3"
zeroize = "=1.9.0"
subtle = "=2.6.1"
# Terminal UI only (crates/tui). ratatui 0.29 is the last line on the 1.85 MSRV;
# Cargo.lock pins its `instability` proc-macro to 0.3.7 for the same reason.
ratatui = "=0.29.0"
crossterm = "=0.28.1"
# Import only (crates/import): parsers for other managers' exports. No crypto.
serde = { version = "=1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
csv = "=1.4.0"
# The same release keepass already uses, so the tree holds one quick-xml.
quick-xml = { version = "=0.40.1", default-features = false }
# Reads KeePass .kdbx (import only). 0.13.0 is the last release on MSRV 1.85.1.
# It brings its own AES, ChaCha20, Twofish, Salsa20, Argon2d and AES-KDF, used
# only to open a foreign database; never for ZebraPass keys.
keepass = { version = "=0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cargo_common_metadata = "allow"

# Argon2 dominates debug-build test time; optimize it even in dev.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
